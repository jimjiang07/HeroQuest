<div id="app">
  <header>
    <button class="rbtn home" id="home" aria-label="Back to home">🏠 Home</button>
    <svg class="hero" aria-hidden="true"><use href="#hero"/></svg>
    <div class="ttl" id="ttl">Hero Quest</div>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <button class="rbtn" id="gear" aria-label="Settings for grown-ups">⚙</button>
  </header>
  <main id="stage"></main>
  <footer id="foot">
    <button class="btn alt" id="back">‹ Back</button>
    <button class="btn hear" id="hear" aria-label="Hear it again">🔊</button>
    <button class="btn" id="next">Next ›</button>
  </footer>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="panel">
    <h2>For grown-ups</h2>
    <label>Voice reads aloud <input type="checkbox" id="vOn" checked></label>
    <label>Voice <select id="vSel"></select></label>
    <label>Speed <input type="range" id="vRate" min="0.6" max="1.2" step="0.05" value="0.9"></label>
    <label>Sound effects <input type="checkbox" id="sOn" checked></label>
    <label>Unlock every step <input type="checkbox" id="uAll"></label>
    <p>No timers and no wrong-answer buzzers: a wrong tap just says “try again”. After each one, ask “How did you work that out?”. Fingers are welcome. Stars and steps are saved on this device only: on a second device, “Unlock every step” lets him carry on.</p>
    <div class="row"><button class="btn alt" id="reset">Clear stars and steps</button><button class="btn" id="close">Done</button></div>
  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
