<title>Hero Quest – Maths &amp; English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6f1; --card:#ffffff; --ink:#1d2140; --c:#d6402b; --soft:#fdebe7; --mid:#f6b9ae;
  --gold:#f4b400; --or:#ff922b; --ok:#2f9e44; --muted:#6a6f92;
  --lane-m:#d6402b; --lane-e:#0c8599;
  --disp:'Luckiest Guy','Impact','Arial Black',sans-serif;
  --body:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --read:'Andika','Century Gothic','Trebuchet MS',sans-serif;
  --cs:clamp(54px,10.2vw,108px);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-sub="english"]{--bg:#f0fafb;--c:#0c8599;--soft:#e3f6f8;--mid:#a5e0e8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15182d;--card:#202545;--ink:#f3f4fc;--c:#ff7a66;--soft:#2c2447;--mid:#6b3b4a;--gold:#ffd43b;--or:#ffa94d;--ok:#69db7c;--muted:#a9aed0;--lane-m:#ff7a66;--lane-e:#3bc9db}
  :root[data-sub="english"]:not([data-theme="light"]){--bg:#12202b;--c:#3bc9db;--soft:#1d3544;--mid:#2b5a6b}
}
:root[data-theme="dark"]{--bg:#15182d;--card:#202545;--ink:#f3f4fc;--c:#ff7a66;--soft:#2c2447;--mid:#6b3b4a;--gold:#ffd43b;--or:#ffa94d;--ok:#69db7c;--muted:#a9aed0;--lane-m:#ff7a66;--lane-e:#3bc9db}
:root[data-theme="dark"][data-sub="english"]{--bg:#12202b;--c:#3bc9db;--soft:#1d3544;--mid:#2b5a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
svg{display:block}

#app{max-width:1040px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 clamp(12px,3vw,28px)}
header{display:flex;align-items:center;gap:14px;padding:14px 0 10px}
.hero{width:52px;height:60px;flex:none}
.ttl{font-family:var(--disp);font-size:clamp(26px,4.4vw,40px);line-height:1;letter-spacing:.3px;text-shadow:2px 2px 0 var(--mid)}
.prog{margin-left:auto;display:flex;gap:7px;align-items:center}
.pd{width:17px;height:17px;border-radius:50%;border:3px solid var(--ink);background:var(--card);transition:background .3s,transform .3s}
.pd.on{background:var(--gold);transform:scale(1.25)}
.pd.ok{background:var(--ok)}
.rbtn{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--card);font-size:22px;display:grid;place-items:center;flex:none}
.home{width:auto;padding:0 16px;border-radius:24px;font-weight:600;font-size:20px;gap:6px;display:flex;align-items:center}
.sp{margin-left:auto}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 20px;gap:clamp(14px,2.4vh,26px);text-align:center}
main.hub{justify-content:flex-start;align-items:stretch}
.prompt{font-size:clamp(24px,3.6vw,34px);font-weight:600;line-height:1.25;max-width:780px}
.sub{font-size:clamp(18px,2.4vw,22px);color:var(--muted);font-weight:500}

/* hub */
.welcome{font-size:clamp(22px,3.2vw,30px);font-weight:600;text-align:center;margin:4px 0 2px}
.lanes{display:grid;grid-template-columns:1fr;gap:22px;width:100%}
@media (min-width:900px){.lanes{grid-template-columns:1fr 1fr}}
.lane{--lane:var(--lane-m);border:4px solid var(--ink);border-radius:28px;padding:16px 16px 20px;background:color-mix(in srgb,var(--lane) 13%,var(--card));text-align:left}
.lane.english{--lane:var(--lane-e)}
.lane h2{font-family:var(--disp);font-weight:400;font-size:clamp(32px,5vw,46px);margin:0 0 12px;color:var(--lane);text-shadow:2px 2px 0 color-mix(in srgb,var(--lane) 25%,transparent);letter-spacing:.4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{border:4px solid var(--ink);border-radius:22px;background:var(--card);padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 7px 0 var(--ink);text-align:center;min-height:210px;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.tile .art{height:92px;width:100%;display:grid;place-items:center}
.tile .art svg.mini{height:92px;width:auto;max-width:100%}
.tile .art .big{font-size:60px;line-height:1}
.tile .art .tt{display:flex;gap:6px}
.tile .nm{font-family:var(--disp);font-size:clamp(22px,3vw,28px);line-height:1.05}
.tile .tag{font-size:17px;font-weight:600;color:var(--muted)}
.tile .stat{font-size:16px;font-weight:700;border-radius:14px;padding:2px 12px;background:var(--soft);color:var(--ink)}
.tile.done .stat{background:var(--ok);color:#fff}
.tile.soon{opacity:.55;box-shadow:0 4px 0 var(--ink);cursor:default}
.tile.soon:active{transform:none;box-shadow:0 4px 0 var(--ink)}

/* ten frame */
.frame{display:grid;grid-template-columns:repeat(5,var(--cs));border:4px solid var(--ink);border-radius:16px;background:var(--card);overflow:hidden}
.cell{width:var(--cs);height:var(--cs);display:grid;place-items:center;border:1.5px solid var(--ink);padding:0;background:transparent;position:relative}
.cell.empty{cursor:pointer}
.cell.empty::after{content:"";width:54%;height:54%;border-radius:50%;border:3px dashed var(--muted);animation:inv 1.8s ease-in-out infinite}
.cell.empty:active::after{transform:scale(.9)}
@keyframes inv{50%{transform:scale(1.12);border-color:var(--ink)}}
.dot{width:76%;height:76%;border-radius:50%;border:3px solid var(--ink);display:block}
.dot.red{background:var(--c)} .dot.or{background:var(--or)} .dot.gd{background:var(--gold)}
.dot.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.dot.lit{animation:lit .6s ease}
@keyframes lit{40%{transform:scale(1.35);box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 60%,transparent)}}
.extras{display:grid;grid-template-columns:repeat(3,var(--cs));gap:6px;align-content:center}
.extras .xs{width:var(--cs);height:var(--cs);display:grid;place-items:center}
.scene{position:relative;display:flex;align-items:center;gap:clamp(18px,4vw,48px);justify-content:center;flex-wrap:wrap}
.fly{position:absolute;z-index:5;transition:left .75s cubic-bezier(.45,-0.4,.5,1.3),top .75s cubic-bezier(.45,-0.4,.5,1.3)}
.eq{font-family:var(--disp);font-size:clamp(42px,8vw,76px);line-height:1;text-shadow:3px 3px 0 var(--mid);min-height:1.1em}
.eq .q{display:inline-block;width:1.1em;border-bottom:5px dashed var(--muted);transform:translateY(-.05em)}
.msg{min-height:1.6em;font-size:clamp(20px,3vw,28px);font-weight:600;color:var(--c)}

/* buttons */
.btn{min-height:64px;padding:12px 28px;border-radius:20px;border:4px solid var(--ink);background:var(--gold);font-weight:700;font-size:clamp(20px,3vw,28px);box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;color:#1d2140}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.red{background:var(--c);color:#fff}
.btn[disabled]{opacity:.35;box-shadow:0 6px 0 var(--ink);cursor:default}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}

/* read cards (maths) */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,18px);width:100%}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rc{position:relative;border:4px solid var(--ink);border-radius:20px;background:var(--card);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:background .25s}
.rc.said{background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.rc .pic{width:100%;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.rc svg.mini{width:100%;max-width:260px;height:clamp(84px,13vw,118px)}
.rc .sum{font-family:var(--disp);font-size:clamp(28px,4vw,40px);line-height:1}
.rc .sum b{color:var(--c);font-weight:400}
.tick{width:56px;height:56px;border-radius:50%;border:4px dashed var(--ink);background:var(--card);font-size:30px;line-height:1;display:grid;place-items:center;transition:all .2s;flex:none}
.said>.tick,.said .tick{border-style:solid;background:var(--ok);color:#fff}
.d-red{fill:var(--c)}.d-or{fill:var(--or)}.d-gd{fill:var(--gold)}
.svgt{font-family:var(--body);font-weight:700;fill:var(--ink)}

/* choices */
.choices{display:flex;gap:clamp(14px,3vw,30px);flex-wrap:wrap;justify-content:center}
.ch{min-width:clamp(120px,22vw,200px);min-height:92px;border-radius:24px;border:5px solid var(--ink);background:var(--card);font-family:var(--disp);font-size:clamp(34px,6vw,56px);box-shadow:0 7px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .2s;color:var(--ink)}
.ch.rd{font-family:var(--read);font-weight:700}
.ch:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.ch.right{background:var(--ok);color:#fff}
.ch.no{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* english */
.tiles2{display:flex;gap:clamp(8px,2vw,16px);justify-content:center;align-items:center;transition:gap .6s cubic-bezier(.4,1.4,.5,1)}
.tl{width:clamp(70px,13vw,120px);height:clamp(82px,15vw,138px);border:5px solid var(--ink);border-radius:20px;background:var(--card);display:grid;place-items:center;font-family:var(--read);font-weight:700;font-size:clamp(46px,9vw,84px);line-height:1;transition:background .4s}
.tl.bl{background:var(--gold);color:#1d2140}
.tl.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.big-emo{font-size:clamp(70px,14vw,130px);line-height:1;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.fams{display:flex;flex-direction:column;gap:12px;width:100%}
.fam{display:flex;align-items:center;gap:clamp(8px,2vw,18px);border:4px solid var(--ink);border-radius:20px;background:var(--card);padding:8px 14px;transition:background .25s}
.fam.said{background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.fam .fb{flex:none;min-width:74px;border:0;border-radius:14px;background:var(--c);color:#fff;font-family:var(--read);font-weight:700;font-size:clamp(28px,4.4vw,40px);padding:6px 10px}
.fam .ws{flex:1;display:flex;gap:clamp(6px,2vw,16px);justify-content:space-around}
.wd{border:0;background:none;font-family:var(--read);font-weight:700;font-size:clamp(30px,5.4vw,52px);padding:6px 8px;border-radius:14px;color:var(--ink)}
.wd:active{background:var(--soft)}
.hb{color:var(--c)}
.sents{display:flex;flex-direction:column;gap:12px;width:100%}
.sent{display:flex;align-items:center;gap:14px;border:4px solid var(--ink);border-radius:20px;background:var(--card);padding:8px 14px;text-align:left;transition:background .25s}
.sent.said{background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.sent .em{font-size:clamp(36px,6vw,54px);flex:none;border:0;background:none;padding:0}
.sent .tx{flex:1;border:0;background:none;text-align:left;font-family:var(--read);font-weight:700;font-size:clamp(26px,4.6vw,44px);line-height:1.25;padding:4px;color:var(--ink)}
.sent .tx span{border-radius:8px;padding:0 2px;transition:background .15s}
.sent .tx span.now{background:var(--gold);color:#1d2140}
.pic-big{font-size:clamp(90px,18vw,170px);line-height:1}

footer{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;justify-content:space-between;align-items:center}
footer .btn{flex:none}
.hear{width:72px;min-height:72px;padding:0;font-size:32px;background:var(--card)}

.medalbox{position:relative;width:min(300px,60vw)}
.medalbox svg{width:100%;height:auto;animation:spin 1s cubic-bezier(.3,1.5,.5,1)}
@keyframes spin{0%{transform:scale(.2) rotate(-25deg)}100%{transform:none}}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.conf i{position:absolute;top:-30px;width:16px;height:16px;border-radius:4px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.ov{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.ov.show{display:flex}
.panel{background:var(--card);border:4px solid var(--ink);border-radius:24px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:22px;text-align:left}
.panel h2{font-family:var(--disp);font-weight:400;font-size:30px;margin:0 0 12px}
.panel label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:20px;font-weight:500;border-bottom:2px solid var(--soft)}
.panel select,.panel input[type=range]{font:inherit;max-width:230px;width:100%}
.panel select{padding:8px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.panel input[type=checkbox]{width:28px;height:28px}
.panel p{font-size:18px;line-height:1.45;color:var(--muted);margin:12px 0 0}
.panel .row{margin-top:14px;justify-content:space-between}

/* games */
.pd.g{border-radius:7px}
.mem{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.8vw,16px);width:100%;max-width:900px}
@media (max-width:560px){.mem{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mc{position:relative;aspect-ratio:3/4;border:4px solid var(--ink);border-radius:18px;background:var(--c);color:#fff;font-family:var(--disp);font-size:clamp(34px,7vw,64px);padding:0;perspective:600px;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.mc:active{transform:translateY(4px)}
.mc .back,.mc .front{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;transition:transform .35s}
.mc .front{background:var(--card);color:var(--ink);transform:rotateY(180deg);gap:2px}
.mc .front b{font-weight:400;font-size:clamp(38px,7.4vw,72px);line-height:1}
.mc .front i{font-style:normal;font-family:var(--body);font-size:clamp(9px,1.5vw,14px);letter-spacing:1px;color:var(--c);line-height:1.1;max-width:90%;word-break:break-all}
.mc.up .back{transform:rotateY(-180deg)} .mc.up .front{transform:rotateY(0)}
.mc.ok{box-shadow:0 0 0 6px var(--ok),0 6px 0 var(--ink)} .mc.ok .front{background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.stars{display:flex;gap:8px;font-size:clamp(26px,4vw,38px);min-height:1.3em}
.balloons{display:flex;flex-wrap:wrap;gap:clamp(18px,5vw,48px);justify-content:center;align-items:flex-end;padding:10px 0 clamp(34px,7vw,56px)}
.bln{position:relative;width:clamp(96px,20vw,150px);height:clamp(118px,24vw,182px);border:5px solid var(--ink);border-radius:50% 50% 48% 48%/58% 58% 42% 42%;background:var(--col);color:#fff;font-family:var(--disp);font-size:clamp(40px,8vw,68px);text-shadow:3px 3px 0 rgba(0,0,0,.28);animation:bob 2.8s ease-in-out infinite alternate;transition:transform .2s,opacity .35s}
.bln::after{content:"";position:absolute;left:50%;top:100%;width:3px;height:clamp(28px,6vw,46px);background:var(--ink);transform:translateX(-50%)}
.bln.pop{transform:scale(1.5);opacity:0;animation:none}
.bln.no{animation:shake .4s}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-14px) rotate(2deg)}}
.hintbox{min-height:10px}
.hintbox svg.mini{width:min(360px,80vw);height:auto;margin:0 auto}
.slots{display:flex;gap:clamp(8px,2vw,16px);justify-content:center}
.slot{width:clamp(64px,13vw,104px);height:clamp(78px,16vw,124px);border:5px dashed var(--muted);border-radius:18px;display:grid;place-items:center;font-family:var(--read);font-weight:700;font-size:clamp(44px,9vw,78px);line-height:1;color:var(--ink);background:var(--card)}
.slot.bl{border-color:var(--gold)}
.slot.full{border-style:solid;border-color:var(--ink);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.slot.full.bl{background:var(--gold);color:#1d2140}
.pool{display:flex;gap:clamp(10px,2.4vw,20px);flex-wrap:wrap;justify-content:center}
.lt{width:clamp(70px,14vw,110px);height:clamp(70px,14vw,110px);border:5px solid var(--ink);border-radius:20px;background:var(--card);color:var(--ink);font-family:var(--read);font-weight:700;font-size:clamp(40px,8vw,66px);box-shadow:0 6px 0 var(--ink);transition:transform .08s,opacity .2s}
.lt:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.lt.used{opacity:.15;pointer-events:none}
.lt.no{animation:shake .4s}
.bridge{position:relative;width:100%;max-width:860px;padding-top:clamp(52px,9vw,80px)}
.hz{position:absolute;top:0;left:0;width:12.5%;display:grid;place-items:center;transform:translateX(calc(var(--i,0)*100%));transition:transform .6s cubic-bezier(.4,1.6,.5,1)}
.hz svg{width:clamp(38px,7vw,62px);height:auto}
.planks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;align-items:center}
.pl{height:clamp(20px,3.4vw,30px);border:3px solid var(--ink);border-radius:8px;background:#c9a27a;transition:background .3s}
.pl.st{background:#868e96}
.pl.ok{background:var(--ok)}
.pl.end{height:auto;background:none;border:0;font-size:clamp(34px,7vw,64px);text-align:center;line-height:1}
.water{height:14px;border-radius:0 0 12px 12px;background:repeating-linear-gradient(90deg,#4dabf7 0 24px,#74c0fc 24px 48px);opacity:.7;margin-top:2px}
.bigq{font-family:var(--read);font-weight:700;font-size:1.15em;color:var(--c)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="hero" viewBox="0 0 100 120">
   <g stroke="#1d2140" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="80" y="8" width="8" height="56" rx="3" fill="#e9eef5"/>

<symbol id="gstar" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.3l-6.2 3.6 1.6-6.9L2.1 9.3l7-.7z" fill="#f4b400" stroke="#1d2140" stroke-width="1.8" stroke-linejoin="round"/></symbol>

<div id="app">
  <header>
    <button class="rbtn home" id="home" aria-label="Back to home">🏠 Home</button>
    <svg class="hero" aria-hidden="true"><use href="#hero"/></svg>
    <div class="ttl" id="ttl">Hero Quest</div>
    <div class="prog" id="prog" aria-hidden="true"></div>

  </header>

<script>
/* ============ storage (this device only) ============ */
const store={
  get(){try{return JSON.parse(localStorage.getItem('hq-v1'))||{}}catch(e){return{}}},
  set(o){try{localStorage.setItem('hq-v1',JSON.stringify(o))}catch(e){}}
};
let saved=store.get(); saved.acts=saved.acts||{};
const cfg={voice:saved.voice??true,voiceName:saved.voiceName||'',rate:saved.rate||0.9,sfx:saved.sfx??true};
const persist=()=>store.set(saved);
const saveCfg=()=>{saved={...saved,...cfg};persist()};
const actState=id=>(saved.acts[id]=saved.acts[id]||{plays:0,done:[]});

/* ============ sound ============ */
let ac=null;
function audio(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,t,d,type='sine',v=.16){
  if(!cfg.sfx)return;const a=audio();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,s);
  g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);

function miniFrame(a,b){

  cards.forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.i;if(lock||open.includes(i)||matched.has(i))return;
    audio();b.classList.add('up');sfx.pop();say(NUMW[vals[i]]);open.push(i);
    if(open.length===2){
      lock=true;const [x,y]=open,sum=vals[x]+vals[y];await sleep(950);
      if(sum===10){
        matched.add(x);matched.add(y);cards[x].classList.add('ok');cards[y].classList.add('ok');sfx.ding();
        $('#msg').textContent=`${vals[x]} and ${vals[y]} make 10!`;say(`${vals[x]} and ${vals[y]} make ten!`);
      }else{
        cards[x].classList.remove('up');cards[y].classList.remove('up');sfx.oops();
        $('#msg').textContent=`${vals[x]} + ${vals[y]} = ${sum}. Not 10. Try again!`;say('Not ten. Try again!');
      }
      open=[];lock=false;
      if(matched.size===vals.length){await sleep(900);sfx.cheer();confetti();say('You found them all! Brilliant!');setOK()}
    }
  });
};

/* maths game 2: Balloon Pop */
RM.balloon=el=>{
  const Rn=[[9,4],[8,5],[7,6],[9,6],[8,7],[9,8]];let r=0;
  const colors=['#d6402b','#e8890c','#2f9e44','#5b4bc4','#0c8599','#c2255c'];
  const draw=()=>{
    const [a,b]=Rn[r],ans=a+b,opts=shuffle([ans-1,ans,ans+1,ans+2]);
    el.innerHTML=`<div class="stars" id="stars" aria-label="${r} of ${Rn.length} popped">${Rn.map((_,i)=>i<r?'⭐':'☆').join('')}</div>
      <div class="prompt">Game: pop the balloon. <b>${a} + ${b}</b> = ?</div>
      <div class="balloons">${opts.map((o,k)=>`<button class="bln" data-v="${o}" style="--col:${colors[(k+r)%6]};animation-delay:${k*.45}s">${o}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>
      <div class="row"><button class="btn alt" id="hint">💡 Hint</button></div><div class="hintbox" id="hb"></div>`;
    prompt=`Pop the balloon. ${a} plus ${b} equals what?`;say(prompt);
    $('#hint').onclick=()=>{
      audio();const need=10-a,left=b-need;
      $('#hb').innerHTML=miniFrame(a,b);
      say(`Fill the ten first! ${a} needs ${need} more. Take ${need} from ${b}. ${left} is left. Ten and ${left} is ${ans}.`);
    };
    $$('.bln',el).forEach(bl=>bl.onclick=async()=>{
      audio();
      if(+bl.dataset.v===ans){
        $$('.bln',el).forEach(x=>x.disabled=true);bl.classList.add('pop');sfx.pop();sfx.ding();
        $('#msg').textContent=`${a} + ${b} = ${ans}!`;say(`${a} plus ${b} equals ${ans}!`);
        await sleep(1700);r++;
        if(r<Rn.length)draw();else{$('#stars').textContent='⭐⭐⭐⭐⭐⭐';sfx.cheer();confetti();say('You popped them all!');setOK()}
      }else{bl.classList.remove('no');void bl.offsetWidth;bl.classList.add('no');sfx.oops();$('#msg').textContent='Try again!';say('Try again!')}
    });
  };
  draw();
};

/* english game 1: Blend Builder */
RE.build=el=>{
  const W=['frog','drum','flag','sled','crab'];let w=0;
  const draw=()=>{
    const word=W[w],letters=[...word];
    const extra=shuffle('abeghimoptuw'.split('').filter(c=>!letters.includes(c))).slice(0,2);
    const pool=shuffle([...letters,...extra]);
    el.innerHTML=`<div class="prompt">Game: build the word. Start with the blend!</div>
      <div class="pic-big" aria-hidden="true">${EMO[word]}</div>
      <div class="slots">${letters.map((_,i)=>`<div class="slot ${i<2?'bl':''}" id="sl${i}"></div>`).join('')}</div>
      <div class="pool">${pool.map(c=>`<button class="lt" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="msg" id="msg"></div><div class="row" id="act"></div>`;
    prompt=`Build the word ${word}. Start with the blend!`;say(prompt);
    let next=0;
    $$('.lt',el).forEach(b=>b.onclick=()=>{
      audio();
      if(b.dataset.c===letters[next]){
        const sl=$('#sl'+next);sl.textContent=b.dataset.c;sl.classList.add('full');b.classList.add('used');sfx.pop();next++;
        if(next===letters.length){
          sfx.ding();$('#msg').innerHTML=hlw(word);$('#msg').style.cssText='font-family:var(--read);font-size:clamp(44px,9vw,80px)';say(word+'!');
          if(w<W.length-1)$('#act').innerHTML=`<button class="btn red" id="more">Next word ›</button>`,$('#more').onclick=()=>{w++;draw()};
          else{sfx.cheer();confetti();setOK()}
        }
      }else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.oops();say('Try another letter.')}
    });
  };
  draw();
};

/* english game 2: Cross the Bridge */
RE.bridge=el=>{
  const Q=[['fl','flag','frog'],['st','star','sled'],['dr','drum','tree'],['fr','frog','flag'],['cr','crab','clap'],['sl','sled','star']];let q=0;
  el.innerHTML=`<div class="bridge" id="br"><div class="hz" id="hz" style="--i:0"><svg viewBox="0 0 100 120" aria-hidden="true"><use href="#hero"/></svg></div>
      <div class="planks">${Array.from({length:8},(_,i)=>`<div class="pl ${i===0?'st':i===7?'end':''}" id="pl${i}">${i===7?'🏰':''}</div>`).join('')}</div><div class="water"></div></div>
    <div class="prompt" id="qp"></div><div class="choices" id="qc"></div><div class="msg" id="msg"></div>`;
  const ask=()=>{
    const [b,right,wrong]=Q[q];const opts=shuffle([right,wrong]);
    $('#qp').innerHTML=`Which word starts with <span class="bigq">${b}</span>?`;$('#msg').textContent='';
    $('#qc').innerHTML=opts.map(o=>`<button class="ch rd" data-w="${o}">${o}</button>`).join('');
    prompt=`Which word starts with ${b[0]}, ${b[1]}?`;say(prompt);
    $$('.ch',el).forEach(c=>c.onclick=async()=>{
      audio();
      if(c.dataset.w===right){
        $$('.ch',el).forEach(x=>x.disabled=true);c.classList.add('right');sfx.hop();say(`${right}!`);
        q++;$('#hz').style.setProperty('--i',q);$('#pl'+q).classList.add('ok');
        await sleep(1100);
        if(q<Q.length)ask();
        else{$('#hz').style.setProperty('--i',7);await sleep(700);$('#qp').textContent='You crossed the bridge!';$('#qc').innerHTML='';sfx.cheer();confetti();say('You crossed the bridge!');setOK()}
      }else{c.classList.remove('no');void c.offsetWidth;c.classList.add('no');sfx.oops();$('#msg').textContent='Try again!';say('Try again!')}
    });
  };
  ask();
};

const TILES=[
  {lane:'maths',id:'jt10',name:'Jump Through 10',tag:'Read & Say + 2 games',art:()=>miniFrame(9,6)},
  {lane:'maths',soon:1,name:'Groups Power',tag:'Times tables',art:()=>`<span class="big">✖️</span>`},
  {lane:'english',id:'blend',name:'Blend Bridge',tag:'Read & Say + 2 games',art:()=>`<div class="tt"><div class="tl bl" style="width:46px;height:54px;font-size:30px;border-width:4px;border-radius:12px">s</div><div class="tl bl" style="width:46px;height:54px;font-size:30px;border-width:4px;border-radius:12px">l</div></div>`},
  {lane:'english',soon:1,name:'Digraph Dungeon',tag:'sh, ch, th',art:()=>`<span class="big">🏰</span>`}
];
function tileHTML(t){
  if(t.soon)return `<button class="tile soon" aria-disabled="true" data-soon="1"><div class="art">${t.art()}</div><div class="nm">${t.name}</div><div class="stat">Coming soon</div></button>`;
  const st=actState(t.id),played=st.plays||0;
  return `<button class="tile ${played?'done':''}" data-id="${t.id}" aria-label="${t.name}"><div class="art">${t.art()}</div><div class="nm">${t.name}</div><div class="tag">${t.tag}</div><div class="stat">${played?'⭐ played '+played+'×':'New'}</div></button>`;
}
function renderHub(){
  stage.className='hub';
  const lane=(k,title)=>`<section class="lane ${k}"><h2>${title}</h2><div class="tiles">${TILES.filter(t=>t.lane===k).map(tileHTML).join('')}</div></section>`;
  stage.innerHTML=`<div class="welcome">Pick a quest! 🗡️</div><div class="lanes">${lane('maths','Maths')}${lane('english','English')}</div>`;
  $$('.tile',stage).forEach(b=>b.onclick=()=>{
    audio();
    if(b.dataset.soon){sfx.oops();return}
    sfx.pop();openAct(b.dataset.id);
  });
}
